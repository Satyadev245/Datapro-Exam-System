services:
  - type: web
    name: student-online-examination-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads/examinations
      - key: ATTENDANCE_UPLOADS_DIR
        value: /var/data/uploads/attendance
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: examination-data
      mountPath: /var/data
      sizeGB: 10
